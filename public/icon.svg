<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#065f46;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#064e3b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="ball" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  
  <!-- Soccer ball -->
  <circle cx="256" cy="256" r="140" fill="url(#ball)"/>
  
  <!-- Pentagon pattern -->
  <path d="M 256 160 L 290 190 L 280 230 L 232 230 L 222 190 Z" fill="#1f2937" opacity="0.3"/>
  <path d="M 320 220 L 340 260 L 320 300 L 280 290 L 280 250 Z" fill="#1f2937" opacity="0.3"/>
  <path d="M 192 220 L 172 260 L 192 300 L 232 290 L 232 250 Z" fill="#1f2937" opacity="0.3"/>
  <path d="M 220 320 L 256 350 L 292 320 L 280 280 L 232 280 Z" fill="#1f2937" opacity="0.3"/>
  
  <!-- Checkmark -->
  <path d="M 180 256 L 230 306 L 332 204" stroke="#10b981" stroke-width="32" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  
  <!-- Shine effect -->
  <ellipse cx="220" cy="200" rx="40" ry="60" fill="white" opacity="0.15"/>
</svg>
