apiVersion: apps/v1
kind: Deployment
metadata:
  name: bingo
  labels:
    app: bingo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: bingo
  template:
    metadata:
      labels:
        app: bingo
    spec:
      containers:
        - name: bingo
          image: bingo:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: bingo
  labels:
    app: bingo
spec:
  type: LoadBalancer
  selector:
    app: bingo
  ports:
    - name: http
      port: 80
      targetPort: 80
