name: Refresh match data

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Refresh active data or compare providers without writing files"
        type: choice
        options:
          - refresh
          - compare
        default: refresh
      provider:
        description: "Provider to use when refreshing"
        type: choice
        options:
          - football-data
          - tubet
        default: football-data

# Serialize refreshes: the every-30-min schedule can overlap a manual
# dispatch, and two concurrent runs race the data/refresh force-push.
concurrency:
  group: refresh-matches
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: write
  pages: write
  id-token: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    outputs:
      data_changed: ${{ steps.commit.outputs.changed }}
      commit_sha: ${{ steps.commit.outputs.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Refresh slate and history
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
          TUBET_API_BASE_URL: ${{ vars.TUBET_API_BASE_URL }}
          TUBET_LEAGUE_ID: ${{ vars.TUBET_LEAGUE_ID }}
          TUBET_CUTOVER_APPROVED: ${{ vars.TUBET_CUTOVER_APPROVED }}
          MATCH_DATA_PROVIDER: ${{ github.event.inputs.provider || 'football-data' }}
          MATCH_DATA_MODE: ${{ github.event.inputs.mode || 'refresh' }}
        run: |
          if [ "$MATCH_DATA_PROVIDER" = "tubet" ] && [ "$MATCH_DATA_MODE" = "refresh" ] && [ "$TUBET_CUTOVER_APPROVED" != "true" ]; then
            echo "::error::Tubet refresh is disabled until TUBET_CUTOVER_APPROVED is set to true after feed comparison."
            exit 1
          fi
          node scripts/refresh-matches.mjs

      - name: Commit data changes
        id: commit
        timeout-minutes: 10
        env:
          GH_TOKEN: ${{ github.token }}
          DATA_BRANCH: data/refresh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/slate.json public/data/history.json
          if git diff --cached --quiet; then
            echo "No data changes"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "Refresh match slate"

          # main requires a PR (ruleset "Protect main"), so land data changes
          # through the data branch + auto-merged PR instead of a direct push.
          EXPECTED=$(git ls-remote origin "refs/heads/$DATA_BRANCH" | cut -f1)
          if [ -n "$EXPECTED" ]; then
            git push --force-with-lease="refs/heads/$DATA_BRANCH:$EXPECTED" origin "HEAD:refs/heads/$DATA_BRANCH"
          else
            git push origin "HEAD:refs/heads/$DATA_BRANCH"
          fi

          # gh pr view <branch> also returns MERGED/CLOSED PRs; only reuse an
          # open PR, otherwise create a fresh one for the new data commit.
          PR_STATE=$(gh pr view "$DATA_BRANCH" --json state --jq .state 2>/dev/null || true)
          if [ "$PR_STATE" != "OPEN" ]; then
            gh pr create --base main --head "$DATA_BRANCH" \
              --title "Refresh match slate" \
              --body "Automated match-data refresh from run ${GITHUB_RUN_ID}."
          fi

          # PRs opened with GITHUB_TOKEN queue the pull_request Tests run in
          # action_required state, and check runs from GITHUB_TOKEN dispatches
          # or synthetic check-run creation never roll up to the PR. That
          # queued run is the only way the ruleset's required "test" check
          # can report, so approve it here and wait for it. A queued run
          # reports status=completed with conclusion=action_required.
          HEAD_SHA=$(git rev-parse HEAD)
          PENDING=""
          for i in $(seq 1 12); do
            PENDING=$(gh run list --workflow tests.yml --branch "$DATA_BRANCH" \
              --event pull_request \
              --json databaseId,headSha,conclusion \
              --jq ".[] | select(.headSha == \"$HEAD_SHA\" and .conclusion == \"action_required\") | .databaseId" | head -1)
            [ -n "$PENDING" ] && break
            sleep 10
          done
          if [ -n "$PENDING" ]; then
            # Cancel queued Tests runs left behind by earlier head SHAs on
            # this branch so they do not linger in action_required forever.
            gh run list --workflow tests.yml --branch "$DATA_BRANCH" \
              --event pull_request \
              --json databaseId,headSha,conclusion \
              --jq ".[] | select(.conclusion == \"action_required\" and .headSha != \"$HEAD_SHA\") | .databaseId" \
              | while read -r STALE; do
                  gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/runs/${STALE}/cancel" || true
                done
            gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/runs/${PENDING}/approve"
            gh run watch "$PENDING" --exit-status
          else
            # Retry path: a previous attempt may have approved and passed
            # the run for this head SHA already.
            DONE=$(gh run list --workflow tests.yml --branch "$DATA_BRANCH" \
              --event pull_request \
              --json databaseId,headSha,status,conclusion \
              --jq ".[] | select(.headSha == \"$HEAD_SHA\" and .status == \"completed\" and .conclusion == \"success\") | .databaseId" | head -1)
            if [ -z "$DONE" ]; then
              echo "::error::No queued or passed Tests run for $HEAD_SHA"
              exit 1
            fi
          fi

          gh pr merge "$DATA_BRANCH" --merge || (sleep 20 && gh pr merge "$DATA_BRANCH" --merge)

          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "sha=$(gh pr view "$DATA_BRANCH" --json mergeCommit --jq '.mergeCommit.oid')" >> "$GITHUB_OUTPUT"

      - name: Warn when the slate is still empty
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.mode != 'compare'
        run: |
          if grep -q '"week": null' public/data/slate.json; then
            echo "::warning::Slate is empty - no upcoming matches were published. Check the FOOTBALL_DATA_TOKEN secret and the provider."
          fi

      - name: Open or update a failure issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'Match data refresh is failing';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              `The [refresh workflow](${runUrl}) failed on ${new Date().toISOString()}.`,
              '',
              'Most likely causes:',
              '- `FOOTBALL_DATA_TOKEN` secret is missing, expired, or invalid',
              '- football-data.org rate limit or outage (free tier: 10 requests/minute)',
              '- Tubet provider misconfiguration in repository variables',
            ].join('\n');
            const issues = await github.rest.issues.listForRepo({
              ...context.repo,
              state: 'open',
            });
            const existing = issues.data.find((issue) => issue.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: existing.number,
                body,
              });
            } else {
              await github.rest.issues.create({ ...context.repo, title, body });
            }

  deploy-pages:
    needs: refresh
    if: needs.refresh.outputs.data_changed == 'true'
    uses: ./.github/workflows/pages.yml
    with:
      ref: ${{ needs.refresh.outputs.commit_sha }}
